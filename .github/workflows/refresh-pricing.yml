# Weekly pricing-catalog refresh. Re-vendors the newest LiteLLM prices file, re-pins + regenerates the
# committed snapshot, opens a PR, waits for the full `ci` run, and MERGES IT AUTOMATICALLY when the change is
# nothing but models + pricing. The PR remains the audit trail; the human gate is gone by design.
#
# The auto-merge is deliberately narrow. It happens only when ALL of these hold:
#   1. The diff touches nothing outside the pricing artifact allowlist (buildRegistry pins, the vendored
#      snapshot, the generated registry). Any other path -> the PR is left open for a human.
#   2. The gpt-4o/gpt-4o-mini anchor prices are unchanged. A changed anchor breaks the hand-computed E2E math
#      oracles, which is a code change, not a data change -> left open for a human.
#   3. The full `ci` check passes on the PR head.
# Anything else (merge conflict, protection change, CI red) leaves the PR open. Failing closed means a stale
# catalog for a week, which is loud and recoverable; failing open would publish unverified prices.
#
# DEPENDABOT IS STRUCTURALLY EXCLUDED: this job only ever merges the one PR number it just created, and the
# allowlist rejects any diff touching package.json / package-lock.json. Dependency bumps never ride along.
#
# IDENTITY: runs as a repo-scoped GitHub App, not the built-in GITHUB_TOKEN. Two reasons. (1) The org and repo
# both set `can_approve_pull_request_reviews: false`, so GITHUB_TOKEN is forbidden from calling createPullRequest
# at all - that is what broke run 30820123047. (2) A PR opened with GITHUB_TOKEN does not fire `pull_request`,
# so CI had to be dispatched by hand; an App token fires it normally. The App is scoped to this one repo with
# Contents: RW + Pull requests: RW, which is strictly less authority than flipping the org-wide toggle.
# Required secrets: REFRESH_BOT_APP_ID, REFRESH_BOT_PRIVATE_KEY.
#
# SECURITY: every value derived from the upstream API (commit sha, date) is validated in refresh.mjs, then
# passed to shell steps only via env: and referenced as quoted "$VARS" (no ${{ }} interpolation inside run:),
# to avoid workflow command injection.
name: refresh-pricing

on:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {} # manual "run now" button

# Every write goes through the App token below, so the built-in token stays read-only.
permissions:
  contents: read

concurrency:
  group: refresh-pricing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # generous: the job blocks on a full CI run before merging
    steps:
      - name: Require the bot credentials (fail loudly, not cryptically)
        env:
          APP_ID: ${{ secrets.REFRESH_BOT_APP_ID }}
          APP_KEY: ${{ secrets.REFRESH_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::REFRESH_BOT_APP_ID / REFRESH_BOT_PRIVATE_KEY are not set. Install the repo-scoped" \
                 "GitHub App (Contents: RW, Pull requests: RW) and add both secrets. Until then this workflow" \
                 "cannot open or merge its PR."
            exit 1
          fi

      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REFRESH_BOT_APP_ID }}
          private-key: ${{ secrets.REFRESH_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }} # so the branch push is authored by the App
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - id: refresh
        name: Refresh the pinned snapshot from LiteLLM
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }} # raises the API rate limit for the commit lookup
          REFRESH_BODY_PATH: ${{ runner.temp }}/refresh-pr-body.md
        run: node scripts/registry/refresh.mjs

      - if: steps.refresh.outputs.changed == 'true'
        name: Quick gate (typecheck + unit) before opening the PR
        run: npm run test:ci

      - id: pr
        if: steps.refresh.outputs.changed == 'true'
        name: Open the refresh PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          R_SHORT: ${{ steps.refresh.outputs.short }}
          R_DATE: ${{ steps.refresh.outputs.date }}
          R_ANCHOR: ${{ steps.refresh.outputs.anchor_changed }}
          BODY_PATH: ${{ runner.temp }}/refresh-pr-body.md
        run: |
          set -euo pipefail
          BRANCH="chore/pricing-refresh-${R_DATE}-${R_SHORT}"
          git config user.name 'tokentally-refresh[bot]'
          git config user.email 'tokentally-refresh@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add scripts/registry/buildRegistry.ts scripts/registry/vendor src/config/registry.generated.json
          git commit -m "chore(pricing): refresh catalog to LiteLLM @ ${R_SHORT} (${R_DATE})"

          # Scope guard: auto-merge only a pure models+pricing change. Compare against the base branch, not the
          # index, so a stray tracked-file edit from any earlier step is caught too.
          ALLOW='^(scripts/registry/buildRegistry\.ts|scripts/registry/vendor/[^/]+\.json|src/config/registry\.generated\.json)$'
          UNEXPECTED="$(git diff --name-only "origin/${GITHUB_REF_NAME}...HEAD" | { grep -Ev "$ALLOW" || true; })"

          AUTOMERGE=true
          if [ -n "$UNEXPECTED" ]; then
            echo "::warning::Diff touches paths outside the pricing allowlist; leaving the PR for a human:"
            echo "$UNEXPECTED"
            AUTOMERGE=false
          fi
          if [ "$R_ANCHOR" = "true" ]; then
            echo "::warning::Anchor price changed; the E2E math oracles need a hand edit. Leaving the PR for a human."
            AUTOMERGE=false
          fi

          git push -u origin "$BRANCH"
          TITLE="chore(pricing): weekly catalog refresh (${R_DATE})"
          if [ "$R_ANCHOR" = "true" ]; then
            TITLE="$TITLE [ANCHOR PRICE CHANGED - update the E2E oracles]"
          fi
          # An App-token PR fires `pull_request` normally, so CI starts on its own (no dispatch needed).
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_PATH"

          {
            echo "number=$(gh pr view "$BRANCH" --json number --jq .number)"
            echo "automerge=$AUTOMERGE"
          } >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.automerge == 'true'
        name: Wait for CI, then merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `gh pr checks --watch` errors out if no check has been registered yet, so wait for one to appear.
          CHECKS_UP=false
          for _ in $(seq 1 20); do
            if gh pr checks "$PR" >/dev/null 2>&1; then CHECKS_UP=true; break; fi
            sleep 15
          done
          if [ "$CHECKS_UP" != "true" ]; then
            echo "::error::No check ever registered on PR #$PR after 5 minutes. Expected the App-token PR to" \
                 "fire ci.yml via pull_request - check that the workflow is enabled and its triggers are intact." \
                 "PR #$PR is open and needs a human."
            exit 1
          fi
          gh pr checks "$PR" --watch --required --fail-fast --interval 20

          # required_conversation_resolution blocks the merge on any unresolved review thread (an automated
          # reviewer's comments land on bot PRs too). Resolve them on THIS PR only; the protection still
          # applies in full to human PRs.
          THREADS="$(gh api graphql -f query='
            query($owner:String!,$name:String!,$num:Int!){
              repository(owner:$owner,name:$name){
                pullRequest(number:$num){
                  reviewThreads(first:100){ nodes{ id isResolved } } } } }' \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" -F num="$PR" \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false) | .id')"
          for T in $THREADS; do
            echo "Resolving review thread $T"
            gh api graphql -f query='
              mutation($id:ID!){ resolveReviewThread(input:{threadId:$id}){ thread{ id } } }' -f id="$T" >/dev/null
          done

          # Retry briefly: the required check can lag behind the run finishing.
          for i in $(seq 1 5); do
            if gh pr merge "$PR" --squash --delete-branch; then
              echo "Merged PR #$PR"
              exit 0
            fi
            echo "Merge attempt $i failed; retrying in 30s"
            sleep 30
          done
          echo "::error::Could not merge PR #$PR automatically. It is open for a human to finish."
          exit 1
